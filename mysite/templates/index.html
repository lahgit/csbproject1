<!DOCTYPE html>
<html>
<head>
    <title>My Site</title>
</head>
<body>
    <h1>Welcome</h1>

    <p>
        <a href="{% url 'polls:index' %}">Go to Polls</a>
        <br>
        <a href="/messaging">Go to messaging</a>
        <br>
        {% if user.is_authenticated %}

        Currently logged in as: {{ user.username }}!
        <form action="{% url 'logout' %}" method="post">
        {% csrf_token %}
        <button type="submit">Log Out</button>
        </form>
        {% else %}
        <p>You are currently not logged in</p>
        <a href="{% url 'login' %}">Go to login</a>
        <br>
        <a href="{% url 'signup' %}">Go to Registration</a>
        {% endif %}
    </p>
</body>
</html>
